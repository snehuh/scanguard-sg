<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — ScanGuard SG</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="header">
    <div class="header__brand">
      <span class="header__shield" aria-hidden="true">🛡️</span>
      <span class="header__title">ScanGuard <span class="header__sg">SG</span></span>
    </div>
  </header>

  <main class="main" style="justify-content:center;align-items:center;text-align:center;">
    <div class="card">
      <p style="font-size:3rem;margin-bottom:.5rem" aria-hidden="true">📵</p>
      <h2 style="margin-bottom:.5rem">You're offline</h2>
      <p style="color:var(--text-muted)">
        ScanGuard needs an internet connection to check URLs.
        Please reconnect and try again.
      </p>
    </div>
  </main>
</body>
</html>
